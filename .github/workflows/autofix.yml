name: Autofix

on:
  pull_request:

permissions: {}

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    name: autofix
    # Fork PRs get a read-only token and their branches are not ours to push to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the fix commit to the PR branch
      actions: write # dispatch CI for the fix commit (see below)
    env:
      HEAD_REF: ${{ github.head_ref }}
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Skip if the last commit is ours
        id: guard
        run: |
          author="$(git log -1 --format=%an)"
          if [ "$author" = "$BOT_NAME" ]; then
            echo "Last commit was made by $BOT_NAME; skipping to avoid a loop."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: 24
          cache: npm

      - if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Fix lint and formatting
        if: steps.guard.outputs.skip == 'false'
        # lint:fix may leave unfixable errors; CI reports those, autofix only fixes.
        run: |
          npm run lint:fix || true
          npm run format

      - name: Commit and push
        id: push
        if: steps.guard.outputs.skip == 'false'
        run: |
          if git diff --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit -am "style: autofix lint and formatting"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not start new workflow runs, so the
      # fix commit would never get CI. workflow_dispatch is the documented
      # exception: dispatch CI on the PR branch so the new head commit is checked.
      - name: Dispatch CI for the fix commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
