name: Pages

on:
  # Deploy only after CI has passed for a push to main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    # workflow_run fires for every completed CI run on main (including failures and
    # manual dispatches); only deploy a successful run triggered by a push.
    # `event == 'push'` also keeps fork PRs from a branch named main out; do not drop it.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      # CI runs per main commit can finish out of order: deploying an older commit after a newer
      # one would roll the site back. Only the commit main still points to is deployed; a newer
      # commit deploys when its own CI run passes. If that newest commit fails CI, deploys pause
      # (the site stays on the last deployed commit) until main is green again.
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" = "$SHA" ]; then latest=true; else latest=false; fi
          echo "tested $SHA, main $head, latest=$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: gate
    if: needs.gate.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit CI tested, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /neon-megacity/
          # Public GA4 measurement id (repository variable); empty means no analytics code runs.
          VITE_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the deployment
      id-token: write # OIDC token that deploy-pages exchanges with Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
