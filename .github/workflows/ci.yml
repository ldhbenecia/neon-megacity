name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by autofix.yml after it pushes a fix commit: pushes made with
  # GITHUB_TOKEN do not trigger pull_request/push workflows, but dispatches do.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR and one for main: a newer commit cancels the run in progress, so a batch of
  # merges only runs CI to the end on its last commit. Pages deploys only a green run of the
  # current main head (pages.yml gate); cancelled runs are skipped there.
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && 'main') || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size

  # Main only (push or dispatch): boot, zero console errors, a non-blank canvas. Pages deploys
  # after check and smoke pass. The full e2e suite is manual: e2e-full.yml.
  smoke:
    name: smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Playwright 1.55 cannot install browser deps on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e -- tests/e2e/smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
