name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by autofix.yml after it pushes a fix commit: pushes made with
  # GITHUB_TOKEN do not trigger pull_request/push workflows, but dispatches do.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled, but every commit on main keeps its run:
  # Pages deploys from successful main runs (workflow_run).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    # Playwright 1.55 cannot install browser deps on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the docs-only check below diffs against main.
          fetch-depth: 0

      # The job always runs (so a required check is never missing); only the slow e2e steps
      # are skipped when a PR changes nothing but docs/** or *.md. Pushes to main always run e2e.
      - name: Detect docs-only change
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the PR merge commit: its first parent is the base branch tip.
            base="HEAD^1"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            # No common ancestor: base stays empty and e2e runs (the safe side).
            base="$(git merge-base origin/main HEAD || true)"
          fi
          docs_only=false
          if [ -n "$base" ]; then
            # --no-renames: a move from src/ into docs/ must list the old path too.
            # quotePath=false: Hangul file names are printed as-is, not quoted.
            files="$(git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD)"
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<<"$files"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size

      - name: Install Playwright Chromium
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
