name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by autofix.yml after it pushes a fix commit: pushes made with
  # GITHUB_TOKEN do not trigger pull_request/push workflows, but dispatches do.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per main commit: a group holds at most one pending run, so with a shared group
  # back-to-back merges cancelled each other's pending runs even without cancel-in-progress.
  # Pages only deploys the newest of them (pages.yml gate).
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  # Superseded PR runs are cancelled; main commits are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the slow SwiftShader e2e runs. Main pushes and main dispatches always run it
  # (Pages deploys only after a fully green main run); PRs and branch dispatches only when they
  # touch what e2e exercises: the app shell, the camera / HUD layer, query hooks or the test setup.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.files.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history: the diff below needs the merge base.
          fetch-depth: 0
      - id: files
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            # HEAD is the PR merge commit: its first parent is the base branch tip.
            base="HEAD^1"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            # No common ancestor: base stays empty and e2e runs (the safe side).
            base="$(git merge-base origin/main HEAD || true)"
          fi
          e2e=true
          if [ -n "$base" ]; then
            # --no-renames: a move must list the old path too; quotePath=false keeps Hangul names.
            files="$(git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD)"
            echo "$files"
            pattern='^(src/ux/|src/main\.ts$|src/boot\.ts$|src/core/query\.ts$|tests/e2e/|playwright\.config\.ts$|scripts/|\.github/|index\.html$|src/style\.css$|package(-lock)?\.json$)'
            if [ -n "$files" ] && ! grep -qE "$pattern" <<<"$files"; then
              e2e=false
            fi
          fi
          echo "e2e=$e2e" | tee -a "$GITHUB_OUTPUT"

  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size

  e2e:
    name: e2e (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # Playwright 1.55 cannot install browser deps on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test:e2e -- --shard="$SHARD"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
