name: e2e (full)

# Manual only: the whole Playwright suite (ux, overlays, perf budget, smoke) on SwiftShader,
# 15-25 minutes. CI runs only check (PRs) and check + smoke (main).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.shard }})
    # Playwright 1.55 cannot install browser deps on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test:e2e -- --shard="$SHARD"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
